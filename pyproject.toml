[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "constutil"
version = "2.0.0"
description = "Typed constant definitions and groups for Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Patchfork", email = "pypi@patchfork.dev"}]
keywords = ["constants", "dataclasses", "typing", "enum"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/patchfork/constutil"
Documentation = "https://constutil.patchfork.dev/"
Repository = "https://github.com/patchfork/constutil"
Issues = "https://github.com/patchfork/constutil/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.14", "build>=1.2", "twine>=6", "markdown>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/constutil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/constutil"]

[tool.ruff.lint.per-file-ignores]
# Retain the existing Generic/TypeVar API while changing base introspection.
"src/constutil/constdef.py" = ["UP046"]
"src/constutil/constgroup.py" = ["UP046"]
